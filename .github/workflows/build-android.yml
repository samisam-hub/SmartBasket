name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      # Public client configuration is embedded by Metro into the APK.
      # Empty variables intentionally keep the app in local-only mode.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript and lint
        run: |
          npm run typecheck
          npm run lint
          npx expo install --check

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/build-android.sh

      - name: Verify APK and prepare download
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          metadata=$("$build_tools/aapt" dump badging "$apk")
          grep -F "package: name='com.smartbasket.app'" <<< "$metadata"
          grep -F "versionCode='$ANDROID_VERSION_CODE'" <<< "$metadata"
          mkdir -p apk-artifact
          name="SmartBasket-0.1.0-build-${ANDROID_VERSION_CODE}.apk"
          cp "$apk" "apk-artifact/$name"
          (cd apk-artifact && sha256sum "$name" > SHA256SUMS.txt)
          printf '### SmartBasket APK\n\nBuild: %s\n\nDownload **SmartBasket-APK-%s** under **Artifacts** below, unzip it and install the APK.\n\nAndroid package: `com.smartbasket.app`; ARM64 phones and x86_64 emulators; no Expo Go or Metro required.\n' "$ANDROID_VERSION_CODE" "$ANDROID_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SmartBasket-APK-${{ github.run_number }}
          path: apk-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
